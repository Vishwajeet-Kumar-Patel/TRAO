version: '3.8'

# NOTE: This docker-compose configuration is for LOCAL DEVELOPMENT & TESTING ONLY.
# In Production:
# - Frontend is deployed on Vercel
# - Backend is deployed on Render (using backend/Dockerfile)
# - Database is hosted on MongoDB Atlas

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prepkit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/interview_prep_kit
      - JWT_SECRET=local-dev-jwt-secret-key-change-in-production
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-1.5-flash
      - LLM_API_KEY=${LLM_API_KEY:-}
      - FRONTEND_URL=http://localhost:3000
      - ALLOW_LOCALHOST_SSRF=true
    depends_on:
      - mongo
    networks:
      - prepkit-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: prepkit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Browser calls localhost:5000 (accessible on user host machine)
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - prepkit-network

  mongo:
    image: mongo:7.0
    container_name: prepkit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - prepkit-network

networks:
  prepkit-network:
    driver: bridge

volumes:
  mongo-data:
