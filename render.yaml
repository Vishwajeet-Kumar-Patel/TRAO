# render.yaml — Render deployment manifest for PrepKit AI Backend
# https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: prepkit-ai-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: free

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false                  # Set your Vercel URL (e.g. https://your-app.vercel.app)

      # ── Secrets — set these in the Render Dashboard ──────────────────────
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value

      - key: MONGODB_URI
        sync: false                  # Paste your MongoDB Atlas connection string in Dashboard

      - key: LLM_API_KEY
        sync: false                  # Your Gemini or OpenAI API key

      # ── LLM config ───────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash

      # ── Crawler & SSRF ───────────────────────────────────────────────────
      - key: ALLOW_LOCALHOST_SSRF
        value: "false"
      - key: CRAWLER_MAX_PAGES
        value: "4"
      - key: CRAWLER_TIMEOUT_MS
        value: "8000"
